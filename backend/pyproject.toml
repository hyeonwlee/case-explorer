[project]
name = "case-explorer-backend"
version = "0.1.0"
description = "Backend API for Case Explorer"
authors = [
    { name = "hwlee", email = "hyeonweel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "backend"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]